                    items:
                      oneOf:
                        - $ref: "#/components/schemas/FieldValidationError"
                        - $ref: "#/components/schemas/UnknownFieldValidationError"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
    put:
      tags: [Book]
      summary: Change book data by ID or ISBN
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idOrIsbn
          schema:
            type: string
          required: true
          description: books ID, ISBN-10 or ISBN-13 code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: book title
                  example: The Chronos Key
                subtitle:
                  type: string
                  description: book subtitle
                  example: Unlocking the Paradox of Time
                description:
                  type: string
                  description: book description
                  example: A brilliant but disgraced physicist must navigate...
                isbn_10:
                  type: string
                  description: ISBN-10 code of book
                  example: 034547076X
                isbn_13:
                  type: string
                  description: ISBN-13 code of book
                  example: 978-0345470767
                author_id:
                  type: string
                  description: referenced author id
                  example: 6930719b4366e4b6e7b81d7f
                publisher_id:
                  type: string
                  description: referenced publisher id
                  example: 69306ac74366e4b6e7b81d79
                publication_date:
                  type: string
                  description: publication date in YYYY-MM-DD format
                  example: 2025-12-05
                genre_id:
                  type: string
                  description: referenced genre id
                  example: 692f3eb9595690df14885a89
                language:
                  type: string
                  description: language code in ISO 6391 format
                  example: en
                page_count:
                  type: number
                  description: number of pages of the book
                  example: 523
                cover_image_url:
                  type: string
                  description: link to the cover image of the book
                stock_count:
                  type: number
                  description: number of books in stock
                  example: 5
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AmendmentInfo"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/FieldValidationError"
                        - $ref: "#/components/schemas/AlternativeValidationError"
                        - $ref: "#/components/schemas/GroupedAlternativeValidationError"
                        - $ref: "#/components/schemas/UnknownFieldValidationError"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
    delete:
      tags: [Book]
      summary: Delete a book by ID or ISBN
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idOrIsbn
          schema:
            type: string
          required: true
          description: books ID, ISBN-10 or ISBN-13 code
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/DeletionInfo"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/FieldValidationError"
                        - $ref: "#/components/schemas/UnknownFieldValidationError"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
