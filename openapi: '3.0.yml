components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    401:
      description: Unauthorized
    403:
      description: Forbidden
    404:
      description: Not Found
    429:
      description: Too Many Requests
      content:
        text/html:
          schema:
            type: string
            example: Too many requests, please try again later.
    500:
      description: Internal Server Error
  schemas:
    Book:
      type: object
      required:
        - id
        - title
        - author
        - publisher
        - publication_date
        - genre
        - language
        - page_count
        - stock_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: book id
        title:
          type: string
          description: book title
        subtitle:
          type: string
          description: book subtitle
        description:
          type: string
          description: book description
        isbn_10:
          type: string
          description: ISBN-10 code of book
        isbn_13:
          type: string
          description: ISBN-13 code of book
        author:
          type: string
          description: referenced author id
        publisher:
          type: string
          description: referenced publisher id
        publication_date:
          type: string
          description: publication date in YYYY-MM-DD format
        genre:
          type: string
          description: referenced genre id
        language:
          type: string
          description: language code in ISO 6391 format
        page_count:
          type: number
          description: number of pages of the book
        cover_image_url:
          type: string
          description: link to the cover image of the book
        stock_count:
          type: string
          description: number of books in stock
        created_at:
          type: string
          description: creation date format of this document in ISO 8601
        updated_at:
          type: string
          description: date of last update of this document in ISO 8601 format
    BookList:
      type: array
      items:
        $ref: "#/components/schemas/Book"
    DetailedBook:
      type: object
      required:
        - id
        - title
        - author
        - publisher
        - publication_date
        - genre
        - language
        - page_count
        - stock_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: book id
        title:
          type: string
          description: book title
        subtitle:
          type: string
          description: book subtitle
        description:
          type: string
          description: book description
        isbn_10:
          type: string
          description: ISBN-10 code of book
        isbn_13:
          type: string
          description: ISBN-13 code of book
        author:
          $ref: "#/components/schemas/Author"
          description: referenced author data
        publisher:
          $ref: "#/components/schemas/Publisher"
          description: referenced publisher data
        publication_date:
          type: string
          description: publication date in YYYY-MM-DD format
        genre:
          $ref: "#/components/schemas/Genre"
          description: referenced genre data
        language:
          type: string
          description: language code in ISO 6391 format
        page_count:
          type: number
          description: number of pages of the book
        cover_image_url:
          type: string
          description: link to the cover image of the book
        stock_count:
          type: string
          description: number of books in stock
        created_at:
          type: string
          description: creation date format of this document in ISO 8601
        updated_at:
          type: string
          description: date of last update of this document in ISO 8601 format
    Author:
      type: object
      required:
        - id
        - first_name
        - last_name
        - birth_date
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: author id
        first_name:
          type: string
          description: first name of author
        last_name:
          type: string
          description: last name of author
        biography:
          type: string
          description: biography text
        birth_date:
          type: string
          description: birth date in YYYY-MM-DD format
        death_date:
          type: string
          description: death date in YYYY-MM-DD format
        created_at:
          type: string
          description: creation date format of this document in ISO 8601
        updated_at:
          type: string
          description: date of last update of this document in ISO 8601 format
    AuthorList:
      type: array
      items:
        $ref: "#/components/schemas/Author"
    Publisher:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: publisher id
        name:
          type: string
          description: publisher name
        address:
          type: string
          description: publisher address
        website:
          type: string
          description: website url
        created_at:
          type: string
          description: creation date format of this document in ISO 8601
        updated_at:
          type: string
          description: date of last update of this document in ISO 8601 format
    PublisherList:
      type: array
      items:
        $ref: "#/components/schemas/Publisher"
    Genre:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: genre id
        name:
          type: string
          description: genre name
        description:
          type: string
          description: genre description
        created_at:
          type: string
          description: creation date format of this document in ISO 8601
        updated_at:
          type: string
          description: date of last update of this document in ISO 8601 format
    GenreList:
      type: array
      items:
        $ref: "#/components/schemas/Genre"
    Response:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/Book"
            - $ref: "#/components/schemas/BookList"
            - $ref: "#/components/schemas/DetailedBook"
            - $ref: "#/components/schemas/CreationInfo"
        cursor:
          $ref: "#/components/schemas/Cursor"
    ErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/FieldValidationError"
              - $ref: "#/components/schemas/AlternativeValidationError"
              - $ref: "#/components/schemas/GroupedAlternativeValidationError"
              - $ref: "#/components/schemas/UnknownFieldValidationError"
    Cursor:
      type: object
      properties:
        created_at_before:
          type: string
          description: created_at_before value for the next request
        limit:
          type: number
          description: maximal number of items
    CreationInfo:
      type: object
      required:
        - id
        - created_at
      properties:
        id:
          type: string
          description: book id
        created_at:
          type: string
          description: creation date format of this document in ISO 8601
    AmendmentInfo:
      type: object
      required:
        - id
        - updated_at
      properties:
        id:
          type: string
          description: book id
        updated_at:
          type: string
          description: date of last update of this document in ISO 8601
    DeletionInfo:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: book id
    FieldValidationError:
      type: object
      description: error description of an invalid field provided in a request
      properties:
        type:
          type: string
          enum: [field]
        location:
          type: string
          enum: [body, params, query]
        path:
          type: string
          description: dot seperated path to property
          example: isbn_10
        value:
          oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
            - type: array
            - type: object
        msg:
          type: string
          description: error message for property
    AlternativeValidationError:
      type: object
      description: error description of two or more fields provided in a request where at least one must be provided
      properties:
        type:
          type: string
          enum: [alternative]
        msg:
          type: string
          description: error message for alternatives
        nestedErrors:
          type: array
          items:
            type: object
            $ref: "#/components/schemas/FieldValidationError"
    GroupedAlternativeValidationError:
      type: object
      description: error description of two or more fields provided in a request where at least one must be provided
      properties:
        type:
          type: string
          enum: [alternative_grouped]
        msg:
          type: string
          description: error message for alternatives
        nestedErrors:
          type: array
          items:
            type: array
            items:
              type: object
              $ref: "#/components/schemas/FieldValidationError"
    UnknownFieldValidationError:
      type: object
      description: error description for unexpected fields that have been provided in a request
      properties:
        type:
          type: string
          enum: [unknown_fields]
        msg:
          type: string
          description: error message for alternatives
        fields:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                description: dot seperated path to property
              location:
                type: string
                enum: [body, params, query]
              value:
                oneOf:
                  - type: string
                  - type: number
                  - type: integer
                  - type: boolean
                  - type: array
                  - type: object
tags:
  - name: Book
    description: create, get, update & delete book entries
  - name: Author
    description: create, get, update & delete author entries
  - name: Publisher
    description: create, get update & delete publisher entries
  - name: Genre
    description: create, get, update & delete genre entries