                  type: string
                  description: first name
                  example: Elara
                last_name:
                  type: string
                  description: last name
                  example: Morningside
                biography:
                  type: string
                  description: biography text
                  example: Elara Morningside (born 1983 in the coastal town of Brindlehaven) is an imaginary British novelist known for her atmospheric fantasy tales that blend folklore, psychological depth, and slow-burn mystery. After studying comparative mythology at the fictitious Aldwych Institute, she spent several years traveling through remote island communities, collecting local legends that later inspired her acclaimed Tideworn Trilogy. Morningside is described as reclusive, preferring long solitary walks along rugged cliffs to public appearances. Her work often explores the tension between memory and myth, and she is celebrated for her evocative prose and richly textured world-building.
                birth_date:
                  type: string
                  description: birth date in YYYY-MM-DD format
                  example: 1983-04-23
                death_date:
                  type: string
                  description: death date in YYYY-MM-DD format
                  example: null
      responses:
        "200":
